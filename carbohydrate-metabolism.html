, "q": "Trap: can acetyl-CoA (from fat) become net glucose in humans?", "a": "No — it activates gluconeogenesis but isn't a substrate; fats don't make net glucose.", "module": "Gluconeogenesis", "moduleIndex": 3, "tags": ["gluconeogenesis", "pyruvate-carboxylase", "PEPCK", "fructose-1", "6-bisphosphatase", "glucose-6-phosphatase", "cori-cycle"], "high_yield": true}, {"id": "4-0", "q": "Rate-limiting enzymes of glycogen synthesis vs breakdown?", "a": "Synthesis = glycogen synthase; breakdown = glycogen phosphorylase.", "module": "Glycogen synthesis & breakdown", "moduleIndex": 4, "tags": ["glycogen", "glycogen-synthase", "glycogen-phosphorylase", "branching-enzyme", "debranching-enzyme", "cAMP"], "high_yield": true}, {"id": "4-1", "q": "Which linkages do the branching and debranching enzymes act on?", "a": "The α-1,6 branch points (branching in synthesis, debranching in breakdown); main chains are α-1,4.", "module": "Glycogen synthesis & breakdown", "moduleIndex": 4, "tags": ["glycogen", "glycogen-synthase", "glycogen-phosphorylase", "branching-enzyme", "debranching-enzyme", "cAMP"], "high_yield": true}, {"id": "4-2", "q": "How do insulin vs glucagon/epinephrine regulate glycogen?", "a": "Insulin activates synthase/inhibits phosphorylase; glucagon (liver) and epinephrine (muscle) raise cAMP→PKA, activating phosphorylase and inhibiting synthase.", "module": "Glycogen synthesis & breakdown", "moduleIndex": 4, "tags": ["glycogen", "glycogen-synthase", "glycogen-phosphorylase", "branching-enzyme", "debranching-enzyme", "cAMP"], "high_yield": true}, {"id": "4-3", "q": "What also activates muscle glycogen phosphorylase during exercise?", "a": "Ca²⁺ and AMP.", "module": "Glycogen synthesis & breakdown", "moduleIndex": 4, "tags": ["glycogen", "glycogen-synthase", "glycogen-phosphorylase", "branching-enzyme", "debranching-enzyme", "cAMP"], "high_yield": true}, {"id": "4-4", "q": "What product does glycogen phosphorylase release?", "a": "Glucose-1-phosphate (then converted to glucose-6-phosphate).", "module": "Glycogen synthesis & breakdown", "moduleIndex": 4, "tags": ["glycogen", "glycogen-synthase", "glycogen-phosphorylase", "branching-enzyme", "debranching-enzyme", "cAMP"], "high_yield": true}, {"id": "4-5", "q": "Vignette: cAMP/PKA activates glycogen breakdown — which hormones?", "a": "Glucagon (liver) and epinephrine (muscle).", "module": "Glycogen synthesis & breakdown", "moduleIndex": 4, "tags": ["glycogen", "glycogen-synthase", "glycogen-phosphorylase", "branching-enzyme", "debranching-enzyme", "cAMP"], "high_yield": true}, {"id": "5-0", "q": "Deficient enzyme and inheritance in Von Gierke (GSD I)?", "a": "Glucose-6-phosphatase; autosomal recessive.", "module": "Glycogen storage disease I — Von Gierke", "moduleIndex": 5, "tags": ["von-gierke", "glucose-6-phosphatase", "fasting-hypoglycemia", "lactic-acidosis", "hyperuricemia"], "high_yield": true}, {"id": "5-1", "q": "Why is fasting hypoglycemia severe in Von Gierke?", "a": "It's the exit step shared by glycogenolysis and gluconeogenesis, so the liver can't release free glucose from either.", "module": "Glycogen storage disease I — Von Gierke", "moduleIndex": 5, "tags": ["von-gierke", "glucose-6-phosphatase", "fasting-hypoglycemia", "lactic-acidosis", "hyperuricemia"], "high_yield": true}, {"id": "5-2", "q": "Classic lab triad of Von Gierke?", "a": "Lactic acidosis, hyperuricemia (gout), and hyperlipidemia.", "module": "Glycogen storage disease I — Von Gierke", "moduleIndex": 5, "tags": ["von-gierke", "glucose-6-phosphatase", "fasting-hypoglycemia", "lactic-acidosis", "hyperuricemia"], "high_yield": true}, {"id": "5-3", "q": "Physical findings in Von Gierke?", "a": "Massive hepatomegaly and renomegaly, doll-like face, protuberant abdomen.", "module": "Glycogen storage disease I — Von Gierke", "moduleIndex": 5, "tags": ["von-gierke", "glucose-6-phosphatase", "fasting-hypoglycemia", "lactic-acidosis", "hyperuricemia"], "high_yield": true}, {"id": "5-4", "q": "Which blood finding distinguishes Von Gierke from Cori and McArdle?", "a": "Elevated lactate (lactic acidosis).", "module": "Glycogen storage disease I — Von Gierke", "moduleIndex": 5, "tags": ["von-gierke", "glucose-6-phosphatase", "fasting-hypoglycemia", "lactic-acidosis", "hyperuricemia"], "high_yield": true}, {"id": "5-5", "q": "Vignette: infant with severe fasting hypoglycemia, hepatomegaly, lactic acidosis, high uric acid and lipids — diagnosis?", "a": "Von Gierke disease (GSD I).", "module": "Glycogen storage disease I — Von Gierke", "moduleIndex": 5, "tags": ["von-gierke", "glucose-6-phosphatase", "fasting-hypoglycemia", "lactic-acidosis", "hyperuricemia"], "high_yield": true}, {"id": "6-0", "q": "Deficient enzyme in Pompe disease (GSD II)?", "a": "Lysosomal acid α-glucosidase (acid maltase).", "module": "Glycogen storage disease II — Pompe", "moduleIndex": 6, "tags": ["pompe", "acid-alpha-glucosidase", "lysosomal", "cardiomegaly", "hypotonia", "normal-glucose"], "high_yield": true}, {"id": "6-1", "q": "How does Pompe differ from other GSDs with respect to blood glucose?", "a": "Blood glucose and lactate are normal — the defect is lysosomal, not in cytosolic glucose handling.", "module": "Glycogen storage disease II — Pompe", "moduleIndex": 6, "tags": ["pompe", "acid-alpha-glucosidase", "lysosomal", "cardiomegaly", "hypotonia", "normal-glucose"], "high_yield": true}, {"id": "6-2", "q": "Hallmark features of infantile Pompe?", "a": "Massive cardiomegaly, hypotonia (floppy baby), macroglossia; death from heart failure if untreated.", "module": "Glycogen storage disease II — Pompe", "moduleIndex": 6, "tags": ["pompe", "acid-alpha-glucosidase", "lysosomal", "cardiomegaly", "hypotonia", "normal-glucose"], "high_yield": true}, {"id": "6-3", "q": "Why is Pompe also considered a lysosomal storage disease?", "a": "It is a lysosomal enzyme defect — glycogen accumulates inside lysosomes.", "module": "Glycogen storage disease II — Pompe", "moduleIndex": 6, "tags": ["pompe", "acid-alpha-glucosidase", "lysosomal", "cardiomegaly", "hypotonia", "normal-glucose"], "high_yield": true}, {"id": "6-4", "q": "Vignette: floppy infant with cardiomegaly and normal glucose — diagnosis?", "a": "Pompe disease (GSD II).", "module": "Glycogen storage disease II — Pompe", "moduleIndex": 6, "tags": ["pompe", "acid-alpha-glucosidase", "lysosomal", "cardiomegaly", "hypotonia", "normal-glucose"], "high_yield": true}, {"id": "7-0", "q": "Deficient enzyme in Cori disease (GSD III)?", "a": "Debranching enzyme (α-1,6-glucosidase).", "module": "Glycogen storage disease III — Cori", "moduleIndex": 7, "tags": ["cori", "debranching-enzyme", "limit-dextrin", "normal-lactate", "mild-hypoglycemia"], "high_yield": true}, {"id": "7-1", "q": "What abnormal glycogen forms in Cori disease?", "a": "Glycogen with short outer branches (limit dextrin).", "module": "Glycogen storage disease III — Cori", "moduleIndex": 7, "tags": ["cori", "debranching-enzyme", "limit-dextrin", "normal-lactate", "mild-hypoglycemia"], "high_yield": true}, {"id": "7-2", "q": "What blood finding distinguishes Cori from Von Gierke?", "a": "Normal lactate (gluconeogenesis is intact); Von Gierke has elevated lactate.", "module": "Glycogen storage disease III — Cori", "moduleIndex": 7, "tags": ["cori", "debranching-enzyme", "limit-dextrin", "normal-lactate", "mild-hypoglycemia"], "high_yield": true}, {"id": "7-3", "q": "Why is Cori milder than Von Gierke?", "a": "Gluconeogenesis is intact, so it's recruited normally during fasting.", "module": "Glycogen storage disease III — Cori", "moduleIndex": 7, "tags": ["cori", "debranching-enzyme", "limit-dextrin", "normal-lactate", "mild-hypoglycemia"], "high_yield": true}, {"id": "7-4", "q": "Trap: debranching vs branching enzyme disease?", "a": "Cori = debranching enzyme (breakdown); Andersen = branching enzyme (synthesis) — both act at α-1,6.", "module": "Glycogen storage disease III — Cori", "moduleIndex": 7, "tags": ["cori", "debranching-enzyme", "limit-dextrin", "normal-lact <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));

/* header */
$('#sectionTitle').textContent = DATA.sectionTitle;
$('#intro').textContent = DATA.intro;
$('#stats').innerHTML = `<b>${DATA.counts.modules}</b> modules · <b>${DATA.counts.cards}</b> flashcards`;

/* theme */
const themeBtn = $('#themeBtn'), root = document.documentElement;
themeBtn.onclick = () => {
  const dark = root.getAttribute('data-theme') === 'dark';
  root.setAttribute('data-theme', dark ? 'light' : 'dark');
  themeBtn.textContent = dark ? '◐ Night' : '◑ Day';
};

/* tabs */
const tabStudy=$('#tabStudy'), tabCards=$('#tabCards'), viewStudy=$('#viewStudy'), viewCards=$('#viewCards');
function setTab(study){
  tabStudy.setAttribute('aria-selected', study); tabCards.setAttribute('aria-selected', !study);
  viewStudy.classList.toggle('hidden', !study); viewCards.classList.toggle('hidden', study);
}
tabStudy.onclick=()=>setTab(true); tabCards.onclick=()=>setTab(false);

/* ---------- STUDY ---------- */
const modList=$('#modList'), article=$('#article');
DATA.modules.forEach((m,i)=>{
  const b=document.createElement('button');
  b.className='modlink'+(m.high_yield?' hy':'');
  b.innerHTML=`<span class="dot"></span><span>${m.title}</span>`;
  b.onclick=()=>showModule(i);
  modList.appendChild(b);
});
function showModule(i){
  const m=DATA.modules[i];
  $$('.modlink').forEach((el,idx)=>el.setAttribute('aria-current', idx===i));
  const facts=[];
  if(m.enzyme) facts.push(`<span class="fact">Enzyme · <b>${m.enzyme}</b></span>`);
  if(m.inheritance) facts.push(`<span class="fact">Inheritance · <b>${m.inheritance}</b></span>`);
  if(m.high_yield) facts.push(`<span class="badge-hy">★ High yield</span>`);
  const tags=m.tags.map(t=>`<span class="tag">${t}</span>`).join('');
  article.innerHTML=`<h2 class="art-title">${m.title}</h2>
    <div class="factstrip">${facts.join('')}</div>
    ${tags?`<div class="tagrow">${tags}</div>`:''}
    <div class="prose">${m.body}</div>`;
  article.scrollIntoView({behavior:'smooth',block:'start'});
}
showModule(0);

/* ---------- FLASHCARDS ---------- */
let scope='all';
const scopeSeg=$('#scopeSeg'), moduleField=$('#moduleField'), tagField=$('#tagField');
const moduleSel=$('#moduleSel'), tagSel=$('#tagSel'), deckCount=$('#deckCount');

DATA.modules.forEach((m,i)=>{
  const o=document.createElement('option'); o.value=i; o.textContent=`${m.title} (${m.cards.length})`; moduleSel.appendChild(o);
});
DATA.tags.forEach(t=>{
  const n=DATA.cards.filter(c=>c.tags.includes(t)).length;
  const o=document.createElement('option'); o.value=t; o.textContent=`${t} (${n})`; tagSel.appendChild(o);
});

scopeSeg.querySelectorAll('button').forEach(b=>{
  b.onclick=()=>{
    scope=b.dataset.scope;
    scopeSeg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed', x===b));
    moduleField.classList.toggle('hidden', scope!=='module');
    tagField.classList.toggle('hidden', scope!=='tag');
    updateDeckCount();
  };
});
moduleSel.onchange=updateDeckCount; tagSel.onchange=updateDeckCount;

function currentSelection(){
  if(scope==='module') return DATA.cards.filter(c=>c.moduleIndex===+moduleSel.value);
  if(scope==='tag') return DATA.cards.filter(c=>c.tags.includes(tagSel.value));
  return DATA.cards.slice();
}
function updateDeckCount(){
  const n=currentSelection().length;
  deckCount.textContent=`${n} card${n===1?'':'s'} in this deck`;
}
updateDeckCount();

/* drill state */
let deck=[], pos=0, revealed=false, got=0, missed=0, missedCards=[];
const deckSetup=$('#deckSetup'), drill=$('#drill'), results=$('#results');
const card=$('#card'), qtext=$('#qtext'), atext=$('#atext'), modRef=$('#modRef');
const judge=$('#judge'), revealHint=$('#revealHint'), pbar=$('#pbar');
const posLabel=$('#posLabel'), gotCount=$('#gotCount'), missCount=$('#missCount');

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}

function startDrill(cards){
  deck=shuffle(cards.slice()); pos=0; got=0; missed=0; missedCards=[];
  deckSetup.classList.add('hidden'); results.classList.add('hidden'); drill.classList.remove('hidden');
  render();
}
function render(){
  if(pos>=deck.length){ return finish(); }
  const c=deck[pos]; revealed=false;
  qtext.textContent=c.q; atext.textContent=c.a; atext.classList.add('hidden');
  judge.classList.add('hidden'); revealHint.classList.remove('hidden');
  modRef.textContent=''; 
  posLabel.textContent=`Card ${pos+1} of ${deck.length}`;
  gotCount.textContent=got; missCount.textContent=missed;
  pbar.style.width=`${(pos/deck.length)*100}%`;
}
function reveal(){
  if(revealed) return;
  revealed=true;
  atext.classList.remove('hidden'); judge.classList.remove('hidden');
  revealHint.classList.add('hidden');
  modRef.textContent='From: '+deck[pos].module;
}
function judgeCard(ok){
  if(!revealed) return;
  if(ok) got++; else { missed++; missedCards.push(deck[pos]); }
  pos++; render();
}
function finish(){
  drill.classList.add('hidden'); results.classList.remove('hidden');
  const total=got+missed, pct=total?Math.round(got/total*100):0;
  $('#scoreNum').innerHTML=`${pct}<small>%</small>`;
  $('#resLine').textContent=`${got} got · ${missed} missed · ${total} cards`;
  $('#drillMissed').classList.toggle('hidden', missedCards.length===0);
}

card.onclick=reveal;
$('#gotBtn').onclick=e=>{e.stopPropagation();judgeCard(true);};
$('#missBtn').onclick=e=>{e.stopPropagation();judgeCard(false);};
$('#startBtn').onclick=()=>{const s=currentSelection(); if(s.length) startDrill(s);};
$('#restartDrill').onclick=()=>startDrill(deck);
$('#exitDrill').onclick=()=>{drill.classList.add('hidden');deckSetup.classList.remove('hidden');};
$('#resRestart').onclick=()=>startDrill(deck);
$('#drillMissed').onclick=()=>startDrill(missedCards);
$('#resNew').onclick=()=>{results.classList.add('hidden');deckSetup.classList.remove('hidden');};

document.addEventListener('keydown',e=>{
  if(viewCards.classList.contains('hidden')||drill.classList.contains('hidden'))return;
  if(e.code==='Space'||e.code==='Enter'){e.preventDefault(); revealed?null:reveal();}
  else if(revealed&&(e.code==='ArrowRight'||e.key.toLowerCase()==='g')) judgeCard(true);
  else if(revealed&&(e.code==='ArrowLeft'||e.key.toLowerCase()==='m')) judgeCard(false);
});
</script>
</body>
